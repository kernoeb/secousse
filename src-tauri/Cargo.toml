[package]
name = "secousse"
version = "0.3.10"
description = "An open-source streaming client for Twitch"
authors = ["kernoeb"]
edition = "2024"

[[bin]]
name = "Secousse"
path = "src/main.rs"

[lib]
name = "secousse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-opener = "2.7"
tauri-plugin-shell = "2"
tauri-plugin-http = { version = "2.8", features = ["unsafe-headers"] }
tauri-plugin-store = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "cookies"] }
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"
anyhow = "1.0"
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
rand = "0.10"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tauri-plugin-log = "2.10"
tauri-plugin-updater = "2"
log = "0.4.34"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
image = { version = "0.25", default-features = false, features = ["webp", "gif", "png", "jpeg"] }

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.26"
objc = "0.2"

[target."cfg(target_os = \"windows\")".dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dwm"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
